name: Release StreamPulse

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Renderer & Package Executables
        run: npm run dist:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Companion Chrome Extension
        run: |
          Compress-Archive -Path "extension/*" -DestinationPath "release/StreamPulse-Chrome-Extension-${{ github.ref_name }}.zip" -Force
        shell: powershell

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: StreamPulse ${{ github.ref_name }} ⚡
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
