<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamPulse Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header -->
    <header class="popup-header">
      <div class="header-brand">
        <img src="../icons/icon48.png" class="brand-logo" alt="StreamPulse">
        <div class="brand-text">
          <h1>StreamPulse</h1>
          <span class="badge-pro">PRO GRABBER</span>
        </div>
      </div>
      <div class="status-indicator" id="app-status">
        <span class="status-dot"></span>
        <span class="status-label" id="status-text">Kontrol ediliyor...</span>
      </div>
    </header>

    <!-- Active Media Card -->
    <section class="media-card" id="media-card">
      <div class="media-preview" id="media-preview">
        <img id="media-thumb" src="" alt="Thumbnail" style="display: none;">
        <div class="media-placeholder" id="media-placeholder">
          <span>YouTube Medyası Aranıyor...</span>
        </div>
      </div>
      <div class="media-info">
        <h2 id="media-title" class="truncate">Sekme inceleniyor...</h2>
        <p id="media-channel" class="truncate">YouTube & YouTube Music</p>
      </div>

      <!-- Custom URL Input (for non-YouTube tabs or custom links) -->
      <div class="custom-url-container" id="custom-url-box" style="display: none;">
        <input type="text" id="custom-url-input" placeholder="YouTube linki veya şarkı adı girin..." autocomplete="off">
      </div>
    </section>

    <!-- Format & Quality Selector -->
    <section class="format-section">
      <div class="section-title">İndirme Formatı & Kalite</div>
      <div class="format-grid">
        <button class="format-btn active" data-type="mp3" data-quality="320">
          <div class="format-icon-svg">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <span class="format-name">MP3</span>
          <span class="format-sub">320 kbps</span>
        </button>

        <button class="format-btn" data-type="flac" data-quality="320">
          <div class="format-icon-svg">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
          </div>
          <span class="format-name">FLAC</span>
          <span class="format-sub">Kayıpsız</span>
        </button>

        <button class="format-btn" data-type="video" data-quality="1080">
          <div class="format-icon-svg">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zm-11-2l6-4-6-4v8z"/></svg>
          </div>
          <span class="format-name">1080p</span>
          <span class="format-sub">Full HD</span>
        </button>

        <button class="format-btn" data-type="video" data-quality="2160">
          <div class="format-icon-svg">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7.5 13.5h2V15H8v-1.5H6.5v-3H8v-1h1.5v1h1v1.5H8v1.5h1.5zm6-5h-3v7h1.5v-2.5h1.5c.8 0 1.5-.7 1.5-1.5v-1.5c0-.8-.7-1.5-1.5-1.5zm0 3h-1.5v-1.5H15v1.5zm3.5-3H17v7h1.5v-2.5h1.2l1.3 2.5H23l-1.6-3c.9-.3 1.6-1.1 1.6-2v-1c0-.8-.7-1-1.5-1zm0 2.5h-1.5V10h1.5v1z"/></svg>
          </div>
          <span class="format-name">4K UHD</span>
          <span class="format-sub">En Yüksek</span>
        </button>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="action-section">
      <button class="btn-primary" id="btn-download">
        <svg viewBox="0 0 24 24" class="btn-svg"><path d="M17 18v1H6v-1h11zm-.5-6.6l-.7-.7-3.8 3.7V4h-1v10.4l-3.8-3.8-.7.7 5 5 5-5z"/></svg>
        <span class="btn-label">StreamPulse ile İndir</span>
      </button>

      <button class="btn-secondary" id="btn-open-app">
        <svg viewBox="0 0 24 24" class="btn-svg"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        <span>Masaüstü Uygulamasını Aç</span>
      </button>
    </div>

    <!-- Status Feedback Message -->
    <div class="feedback-msg" id="feedback-msg"></div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>AI-Driven Desktop Integration</span>
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
